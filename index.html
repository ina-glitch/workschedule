<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INA-working schedule💣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2333;
    --ink-soft:#4A5164;
    --paper:#F5F6F4;
    --card:#FFFFFF;
    --muted:#8A93A6;
    --line:#E3E5E0;
    --teal:#2F6F5E;
    --teal-deep:#204F42;
    --amber:#E2A63B;
    --amber-bg:#FCF2DE;
    --red:#C6413A;
    --red-bg:#FBE7E5;
    --low-bg:#EDF1EF;
    --weekend-bg:#ECEDEC;
    --note-bg:#ECEDF1;
    --note-text:#5B6472;
    --note-line:#C7CCD6;
    --hold-bg:#E7E9F2;
    --hold-text:#565F82;
    --hold-line:#C9CEE0;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,35,51,0.04), 0 4px 14px rgba(28,35,51,0.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }

  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--card);
    padding:22px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    display:inline-block;
    width:10px;height:10px;
    background:var(--teal);
    border-radius:2px;
    transform:rotate(45deg);
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .stat-strip{
    display:flex;
    gap:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-strip b{
    font-size:16px;
    font-family:'Space Grotesk',sans-serif;
    color:var(--ink);
    display:block;
    line-height:1.1;
  }
  .stat-strip .stat{ min-width:52px; }
  .stat-strip .stat.warn b{ color:var(--red); }

  .layout{
    display:grid;
    grid-template-columns:320px 1fr 300px;
    gap:0;
    align-items:start;
    max-width:1620px;
    margin:0 auto;
  }

  /* ---- work summary sidebar ---- */
  .summary-sidebar{
    border-right:1px solid var(--line);
    padding:28px 20px;
    position:sticky;
    top:73px;
    height:calc(100vh - 73px);
    overflow-y:auto;
  }

  /* ---- right sidebar (this week meetings / trips) ---- */
  .summary-sidebar-right{
    border-left:1px solid var(--line);
    padding:28px 20px;
    position:sticky;
    top:73px;
    height:calc(100vh - 73px);
    overflow-y:auto;
  }

  /* ---- form panel (now rendered inside a modal) ---- */
  .panel{
    padding:2px 2px 4px;
  }
  .modal-box.task-modal-box{ max-width:460px; }
  .task-modal-box .modal-head{ align-items:flex-start; }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 4px;
  }
  .panel .hint{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  .field textarea,
  .field input,
  .field select{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input[type="date"]{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .field input[type="date"]:disabled{
    background:var(--paper);
    color:var(--muted);
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
    font-family:'Inter',sans-serif;
  }
  .field textarea:focus,
  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(47,111,94,0.12);
  }
  .field .row{ display:flex; gap:8px; align-items:center; }
  .field .row input[type="date"]{ flex:1; }
  .field .row button{
    flex:none;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--teal-deep);
    background:var(--low-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
  }
  .field .row button:hover{ background:#dfe9e5; }

  .unlimited-toggle{
    flex:none;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
  }
  .unlimited-toggle input[type="checkbox"]{
    width:auto;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .urgency-picker{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .urgency-picker input{ display:none; }
  .urgency-picker label{
    text-align:center;
    padding:8px 2px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
    background:var(--card);
    transition:all .15s ease;
  }
  .urgency-picker input:checked + label.u-top{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .urgency-picker input:checked + label.u-high{ background:var(--amber-bg); border-color:var(--amber); color:#8a6415; }
  .urgency-picker input:checked + label.u-normal{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .urgency-picker input:checked + label.u-note{ background:var(--note-bg); border-color:var(--note-line); color:var(--note-text); }

  .submit-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:12px 0;
    font-size:13.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--teal-deep); }
  .cancel-edit-btn{
    width:100%;
    background:var(--card);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 0;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:8px;
    transition:background .15s ease;
  }
  .cancel-edit-btn:hover{ background:var(--low-bg); }
  .panel.editing{ box-shadow:inset 3px 0 0 var(--teal); }

  /* ---- main list ---- */
  .main{ padding:28px 28px 60px; }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .list-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0;
  }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  .add-task-btn{
    border:none;
    background:var(--ink);
    color:#fff;
    border-radius:7px;
    padding:0 16px;
    height:32px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:background .15s ease;
  }
  .add-task-btn:hover{ background:var(--teal-deep); }
  .add-task-btn.loan-btn{ background:#1B6E8C; }
  .add-task-btn.loan-btn:hover{ background:#144F65; }

  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:var(--card);
  }
  .seg button{
    border:none;
    background:transparent;
    padding:7px 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--ink); color:#fff; }

  .source-select{
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--card);
    padding:0 10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    height:32px;
  }
  .source-select:focus{ outline:none; border-color:var(--teal); }

  .search-input{
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--card);
    padding:0 10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    height:32px;
    width:220px;
    max-width:100%;
  }
  .search-input:focus{ outline:none; border-color:var(--teal); }
  .search-input::placeholder{ color:var(--muted); }

  /* ---- work summary ---- */
  .summary-section{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:22px;
  }
  .summary-col{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .summary-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .summary-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px;
    margin:0;
  }
  .summary-range{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .summary-list{ display:flex; flex-direction:column; gap:8px; }
  .summary-empty{
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    padding:18px 0;
  }
  .summary-item{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .summary-item:hover{ border-color:var(--teal); background:var(--low-bg); }
  .summary-item .dot{
    flex-shrink:0;
    width:8px; height:8px;
    border-radius:50%;
  }
  .summary-item .dot.dot-top{ background:var(--red); }
  .summary-item .dot.dot-high{ background:var(--amber); }
  .summary-item .dot.dot-normal{ background:var(--teal); }
  .summary-item .dot.dot-note{ background:var(--muted); }
  .summary-item .si-title{
    flex:1 1 100%;
    min-width:0;
    font-size:13px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-left:2px;
  }
  .summary-item .si-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    flex:1 1 auto;
    min-width:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .summary-item .si-date{ white-space:nowrap; }
  .summary-item .si-deadline{ white-space:nowrap; }
  .summary-item .si-actions{ display:flex; gap:4px; flex-shrink:0; margin-left:auto; }
  .summary-item .si-actions button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    padding:4px 8px;
    font-size:10.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .summary-item .si-actions .done-btn:hover{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .summary-item .si-actions .hold-btn:hover{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .summary-item .si-actions .edit-btn:hover{ background:#EEF0FB; border-color:#4A4FB0; color:#4A4FB0; }
  .summary-item.is-hold{ border-color:var(--hold-line); background:var(--hold-bg); }


  .overdue-group{ margin-bottom:14px; }
  .overdue-group:last-child{ margin-bottom:0; }
  .og-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }
  .og-head .og-count{
    background:var(--red-bg);
    color:var(--red);
    font-weight:700;
    border-radius:20px;
    padding:1px 8px;
    font-size:10.5px;
  }
  .og-list{ display:flex; flex-direction:column; gap:8px; }

  .empty{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .empty .big{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .cards{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:grid;
    grid-template-columns:5px 1fr auto;
    gap:16px;
    align-items:start;
    position:relative;
  }
  .card .stripe{
    align-self:stretch;
    border-radius:4px;
    background:var(--low-bg);
  }
  .card.u-top .stripe{ background:var(--red); }
  .card.u-high .stripe{ background:var(--amber); }
  .card.u-normal .stripe{ background:var(--teal); }
  .card.u-note .stripe{ background:var(--note-line); }

  .card.done{ opacity:0.55; }
  .card.done .title{ text-decoration:line-through; color:var(--muted); }
  .card.hold{ background:var(--hold-bg); }
  .card.hold .stripe{ background:var(--hold-text); }

  .card .body{ min-width:0; }
  .title{
    font-size:14.5px;
    font-weight:600;
    margin:0 0 6px;
    word-break:break-word;
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    align-items:center;
  }
  .meta .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    border:1px solid var(--line);
  }
  .tag.u-top{ background:var(--red-bg); color:var(--red); border-color:transparent; }
  .tag.u-high{ background:var(--amber-bg); color:#8a6415; border-color:transparent; }
  .tag.u-normal{ background:var(--low-bg); color:var(--teal-deep); border-color:transparent; }
  .tag.u-note{ background:var(--note-bg); color:var(--note-text); border-color:transparent; }
  .meta .source{
    padding:2px 8px;
    border-radius:20px;
    background:#EEF0FB;
    color:#4A4FB0;
    font-weight:600;
  }
  .meta .category{
    padding:2px 8px;
    border-radius:20px;
    background:#FDEDF3;
    color:#B0397A;
    font-weight:600;
  }
  .meta .complete-note{
    flex-basis:100%;
    display:block;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:12px;
    background:var(--low-bg);
    border-radius:8px;
    padding:6px 10px;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .badge{
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .badge.overdue{ background:var(--red); color:#fff; }
  .badge.soon{ background:var(--amber); color:#4a3510; }
  .badge.ok{ background:var(--low-bg); color:var(--ink-soft); }
  .badge.unlimited{ background:var(--note-bg); color:var(--note-text); }
  .badge.hold{ background:var(--hold-bg); color:var(--hold-text); }

  .actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-self:center;
  }
  .actions button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    padding:6px 12px;
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .actions .done-btn:hover{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .actions .hold-btn:hover{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .actions .hold-btn.active{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .actions .edit-btn:hover{ background:#EEF0FB; border-color:#4A4FB0; color:#4A4FB0; }
  .actions .del-btn:hover{ background:var(--red-bg); border-color:var(--red); color:var(--red); }

  /* ---- calendar ---- */

  /* compact legend blended directly into a field, instead of a standalone card */
  .field-legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px 12px;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .field-legend .legend-item{ display:inline-flex; align-items:center; gap:4px; }
  .field-legend .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .field-legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .field-legend .swatch.cat-leave{ background:#E4EEFC; }
  .field-legend .swatch.cat-meeting{ background:#F1E9FB; }
  .field-legend .swatch.cat-trip{ background:var(--amber-bg); }
  .field-legend .swatch.cat-legal{ background:#FDEDF3; }
  .field-legend .swatch.cat-none{ background:var(--low-bg); }
  .field-legend .dot.dot-top{ background:var(--red); }
  .field-legend .dot.dot-high{ background:var(--amber); }
  .field-legend .dot.dot-normal{ background:var(--teal); }
  .field-legend .dot.dot-note{ background:var(--muted); }


  .unscheduled-bar{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    width:100%;
  }
  .unscheduled-bar .chip{
    cursor:pointer;
    font-size:13px;
    padding:6px 12px;
    border-radius:7px;
    width:100%;
    box-sizing:border-box;
  }

  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .cal-nav .label{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    min-width:150px;
  }
  .cal-select{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    height:30px;
    padding:0 8px;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .cal-select:hover{ background:var(--low-bg); }
  .cal-select:focus{ outline:none; border-color:var(--teal); }
  .nav-btn{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    width:30px; height:30px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .nav-btn:hover{ background:var(--low-bg); }
  .today-btn{
    width:auto;
    padding:0 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:auto;
  }

  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .cal-weekdays span{
    text-align:center;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    padding-bottom:4px;
  }
  .cal-weekdays span.sun{ color:var(--muted); }
  .cal-weekdays span.sat{ color:var(--muted); }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:118px;
    gap:6px;
  }
  .cal-day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px;
    height:118px;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ==== Supabase 設定：請填入你自己專案的 Project URL 與 anon public key ====
  const SUPABASE_URL = 'https://svcsjkvzzddimfqjxwvj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_-mDe3WCxiH3lJ_Awh9TBkQ_XNM34QFY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const TABLE = 'tasks';
  const LOAN_TABLE = 'contract_loans';

  // Some fields (category / completed_at / complete_note) are newer additions.
  // If the Supabase table hasn't had those columns added yet, PostgREST returns
  // an "unknown column" error. Rather than failing the whole save, we detect
  // that specific error, drop the offending column from the payload, and retry
  // — so core fields still save even before the table is migrated.
  function extractMissingColumn(error){
    if(!error || !error.message) return null;
    const m = /Could not find the '([\w]+)' column/i.exec(error.message)
      || /column "?([\w]+)"? .*does not exist/i.exec(error.message);
    return m ? m[1] : null;
  }
  async function resilientWrite(table, kind, payload, id){
    let body = { ...payload };
    let missingCols = [];
    for(let attempt=0; attempt<6; attempt++){
      const query = kind === 'insert'
        ? sb.from(table).insert(body)
        : sb.from(table).update(body).eq('id', id);
      const { error } = await query;
      if(!error) return { error:null, missingCols };
      const col = extractMissingColumn(error);
      if(col && col in body){
        delete body[col];
        missingCols.push(col);
        continue;
      }
      return { error, missingCols };
    }
    return { error:new Error('儲存失敗，欄位不符'), missingCols };
  }
  let schemaWarningShown = false;
  function warnMissingColumns(cols){
    if(!cols || cols.length === 0 || schemaWarningShown) return;
    schemaWarningShown = true;
    console.warn('Supabase 資料表缺少欄位，已略過儲存：', cols.join(', '), '－ 請至 Supabase 新增這些欄位，否則相關資料只會暫存在本機，重新整理後可能消失。');
  }

  const STORAGE_KEY = 'worklog.tasks.v1';
  const LOAN_STORAGE_KEY = 'worklog.loans.v1';
  const urgencyLabel = { top:'最急件', high:'急件', normal:'普通件', note:'備註' };
  const urgencyRank = { top:0, high:1, normal:2, note:3 };
  const weekdayNames = ['日','一','二','三','四','五','六'];

  let tasks = [];
  let filterMode = 'all';
  let searchQuery = '';
  let urgencyFilter = 'all';
  let sourceFilter = 'all';
  let categoryFilter = 'all';
  let calRefDate = new Date();
  let modalDateKey = null;
  let editingId = null;

  let loans = [];
  let editingLoanId = null;
  let pendingReturnLoanId = null;

  async function load(){
    try{
      const { data, error } = await sb.from(TABLE).select('*').order('received', { ascending:false });
      if(error) throw error;
      tasks = data || [];
      tasks.forEach(t => {
        if(t.source === undefined || t.source === null) t.source = '';
        if(t.category === undefined || t.category === null) t.category = '';
        if(t.progress === undefined || t.progress === null) t.progress = '';
        t.completedAt = t.completed_at || null;
        t.completeNote = t.complete_note || '';
        t.onHold = !!t.on_hold;
        t.holdNote = t.hold_note || '';
        // migrate old urgency values (high/mid/low) to new scheme
        if(t.urgency === 'mid') t.urgency = 'normal';
        if(t.urgency === 'low') t.urgency = 'note';
        if(!urgencyLabel[t.urgency]) t.urgency = 'normal';
        // migrate old datetime values to date-only
        if(t.received && t.received.includes('T')) t.received = t.received.split('T')[0];
        if(t.deadline && typeof t.deadline === 'string' && t.deadline.includes('T')) t.deadline = t.deadline.split('T')[0];
      });
    }catch(e){
      console.error('讀取 Supabase 資料失敗，改用本機備份：', e);
      // 連不到 Supabase 時，退回舊的 localStorage 備份，避免資料完全無法顯示
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
      }catch(e2){ tasks = []; }
    }
  }
  // 本機備份，主要資料以 Supabase 為主，localStorage 只作離線保險
  function saveLocalBackup(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  async function loadLoans(){
    try{
      const { data, error } = await sb.from(LOAN_TABLE).select('*').order('loan_date', { ascending:false });
      if(error) throw error;
      loans = data || [];
      loans.forEach(l => {
        if(l.department === undefined || l.department === null) l.department = '';
        if(l.purpose === undefined || l.purpose === null) l.purpose = '';
        if(l.note === undefined || l.note === null) l.note = '';
        l.expectedReturn = l.expected_return || null;
        l.returnDate = l.return_date || null;
        l.returnNote = l.return_note || '';
      });
    }catch(e){
      console.error('讀取合約借閱資料失敗，改用本機備份：', e);
      // 連不到 Supabase（例如資料表尚未建立）時，退回本機備份，避免資料完全無法顯示
      try{
        const raw = localStorage.getItem(LOAN_STORAGE_KEY);
        loans = raw ? JSON.parse(raw) : [];
      }catch(e2){ loans = []; }
    }
  }
  function saveLoanLocalBackup(){ localStorage.setItem(LOAN_STORAGE_KEY, JSON.stringify(loans)); }

  function pad(n){ return String(n).padStart(2,'0'); }
  function toLocalDateValue(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function parseDateLocal(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function fmtDate(dateStr){
    if(!dateStr) return '不限';
    const [y,m,d] = dateStr.split('-');
    return `${y}/${m}/${d}`;
  }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const categoryInput = document.getElementById('category');

  // default received = today
  const receivedInput = document.getElementById('received');
  receivedInput.value = toLocalDateValue(new Date());
  document.getElementById('nowBtn').addEventListener('click', () => {
    receivedInput.value = toLocalDateValue(new Date());
  });

  // deadline "不限" toggle
  const deadlineInput = document.getElementById('deadline');
  const deadlineUnlimited = document.getElementById('deadlineUnlimited');
  deadlineUnlimited.addEventListener('change', () => {
    if(deadlineUnlimited.checked){
      deadlineInput.value = '';
      deadlineInput.disabled = true;
      deadlineInput.required = false;
    }else{
      deadlineInput.disabled = false;
      deadlineInput.required = true;
    }

  // ---- category-driven form mode ----
  // "法務" keeps the full rule set (received date + urgency + deadline).
  // All other categories only need a single work date; the task then just
  // shows up on that date in the calendar (no urgency picker, no deadline).
  // 除了「法務」維持完整規則外，其餘所有類別（含「不指定」）都只需要填工作時間
  function isSimpleCategory(category){ return category !== '法務'; }
  const urgencyFieldEl = document.getElementById('urgencyField');
  const deadlineFieldEl = document.getElementById('deadlineField');
  const receivedLabelEl = document.getElementById('receivedLabel');

  function applyCategoryMode(category){
    const isSimple = isSimpleCategory(category);
    urgencyFieldEl.style.display = isSimple ? 'none' : '';
    deadlineFieldEl.style.display = isSimple ? 'none' : '';
    receivedLabelEl.textContent = isSimple ? '工作時間' : '收到工作的日期';
    if(isSimple){
      document.getElementById('u-normal').checked = true;
      deadlineUnlimited.checked = true;
      deadlineInput.value = '';
      deadlineInput.disabled = true;
      deadlineInput.required = false;
    }
  }
  categoryInput.addEventListener('change', () => applyCategoryMode(categoryInput.value));
  applyCategoryMode(categoryInput.value);

  function deadlineStatus(deadlineStr, done){
    if(done) return { key:'done' };
    if(!deadlineStr) return { key:'unlimited', label:'不限期限' };
    const dl = parseDateLocal(deadlineStr);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((dl - today) / 86400000);
    if(diffDays < 0) return { key:'overdue', label:'已逾期' };
    if(diffDays <= 1) return { key:'soon', label:'即將到期' };
    return { key:'ok', label:'尚有餘裕' };
  }

  function filteredTasks(){
    let list = tasks.slice();
    if(filterMode === 'active') list = list.filter(t => !t.done);
    if(filterMode === 'done') list = list.filter(t => t.done);
    if(filterMode === 'hold') list = list.filter(t => t.onHold);
    if(urgencyFilter !== 'all') list = list.filter(t => t.urgency === urgencyFilter);
    if(sourceFilter !== 'all') list = list.filter(t => (t.source || '(未填寫來源)') === sourceFilter);
    if(categoryFilter === 'none') list = list.filter(t => !t.category);
    else if(categoryFilter !== 'all') list = list.filter(t => t.category === categoryFilter);
    if(searchQuery){
      const q = searchQuery.trim().toLowerCase();
      if(q) list = list.filter(t =>
        (t.title || '').toLowerCase().includes(q) ||
        (t.source || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function renderSourceOptions(){
    const sel = document.getElementById('sourceFilter');
    const sources = Array.from(new Set(tasks.map(t => t.source && t.source.trim() ? t.source.trim() : '(未填寫來源)'))).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    const prev = sourceFilter;
    sel.innerHTML = `<option value="all">全部來源</option>` +
      sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    // keep current selection if it still exists among sources, else reset to all
    if(prev !== 'all' && sources.includes(prev)){
      sel.value = prev;
    }else{
      sourceFilter = 'all';
      sel.value = 'all';
    }
  }

  function cardHtml(t){

      if(status.key === 'overdue') badgeHtml = `<span class="badge overdue">⚠ ${status.label}</span>`;
      else if(status.key === 'soon') badgeHtml = `<span class="badge soon">⏰ ${status.label}</span>`;
      else if(status.key === 'unlimited') badgeHtml = `<span class="badge unlimited">${status.label}</span>`;
      else badgeHtml = `<span class="badge ok">${status.label}</span>`;
    }
    const holdBadgeHtml = (t.onHold && !t.done) ? `<span class="badge hold">⏸ 暫緩</span>` : '';    const sourceHtml = t.source ? `<span class="source">來源：${escapeHtml(t.source)}</span>` : '';
    const categoryHtml = t.category ? `<span class="category">類別：${escapeHtml(t.category)}</span>` : '';
    const urgencyTagHtml = isSimpleCategory(t.category) ? '' : `<span class="tag u-${t.urgency}">${urgencyLabel[t.urgency]}</span>`;
    const completeInfoHtml = t.done && t.completedAt
      ? `<span class="badge ok">✅ 完成：${fmtDate(t.completedAt)}</span>`
      : '';
    const completeNoteHtml = t.completeNote
      ? `<span class="complete-note">完成說明：${escapeHtml(t.completeNote)}</span>`
      : '';
    const holdNoteHtml = t.holdNote
      ? `<span class="complete-note">暫緩說明：${escapeHtml(t.holdNote)}</span>`

    const progressHtml = t.progress
      ? `<span class="complete-note">進度：${escapeHtml(t.progress)}</span>`

      <div class="card u-${t.urgency}${t.done ? ' done' : ''}${(t.onHold && !t.done) ? ' hold' : ''}">
        <div class="stripe"></div>

          <div class="meta">

            <span>結案：${fmtDate(t.deadline)}</span>

  function renderStats(){
    document.getElementById('statTotal').textContent = tasks.length;
    document.getElementById('statActive').textContent = tasks.filter(t=>!t.done).length;
    document.getElementById('statHold').textContent = tasks.filter(t=>t.onHold && !t.done).length;
    document.getElementById('statOverdue').textContent = tasks.filter(t=>!t.done && deadlineStatus(t.deadline,false).key==='overdue').length;
  }

  // ==== 合約借閱（合約正本借出明細）====
  function loanStatus(l){
    if(l.returnDate) return { key:'returned', label:'已歸還' };
    if(!l.expectedReturn) return { key:'unlimited', label:'借出中（未定歸還日）' };
    const dl = parseDateLocal(l.expectedReturn);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((dl - today) / 86400000);
    if(diffDays < 0) return { key:'overdue', label:'逾期未還' };
    if(diffDays <= 3) return { key:'soon', label:'即將到期' };
    return { key:'borrowed', label:'借出中' };
  }

  const loanStatusRank = { overdue:0, soon:1, borrowed:2, unlimited:3, returned:4 };
  function compareLoans(a,b){
    const ra = loanStatusRank[loanStatus(a).key], rb = loanStatusRank[loanStatus(b).key];
    if(ra !== rb) return ra - rb;
    return (b.loan_date || '').localeCompare(a.loan_date || '');
  }
  function loanDotClass(statusKey){
    if(statusKey === 'overdue') return 'dot-top';
    if(statusKey === 'soon') return 'dot-high';
    if(statusKey === 'unlimited') return 'dot-note';
    return 'dot-normal';
  }

  function loanCardHtml(l){

    if(status.key === 'overdue') badgeHtml = `<span class="badge overdue">⚠ ${status.label}</span>`;

    else if(status.key === 'unlimited') badgeHtml = `<span class="badge unlimited">${status.label}</span>`;
    else if(status.key === 'returned') badgeHtml = `<span class="badge returned">✅ ${status.label}</span>`;
    else badgeHtml = `<span class="badge ok">${status.label}</span>`;
    const deptHtml = l.department ? `<span class="source">單位：${escapeHtml(l.department)}</span>` : '';
    const purposeHtml = l.purpose ? `<span class="complete-note">事由：${escapeHtml(l.purpose)}</span>` : '';
    const returnInfoHtml = l.returnDate
      ? `<span class="badge ok">📥 歸還日：${fmtDate(l.returnDate)}</span>`

    const returnNoteHtml = l.returnDate && l.returnNote

    return `
      <div class="card loan-card status-${status.key}">

            <span class="source">借閱人：${escapeHtml(l.borrower)}</span>
            ${deptHtml}
            <span>借出：${fmtDate(l.loan_date)}</span>
            <span>預計歸還：${fmtDate(l.expectedReturn)}</span>
            ${badgeHtml}
            ${returnInfoHtml}
            ${purposeHtml}
            ${returnNoteHtml}
            ${noteHtml}
          </div>
        </div>
        <div class="actions">
          <button class="loan-return-btn" data-id="${l.id}">${l.returnDate ? '取消歸還' : '標記歸還'}</button>
          <button class="loan-edit-btn" data-id="${l.id}">編輯</button>

  // 合約借閱不再有獨立分頁，新增／編輯／刪除／歸還後只需要刷新右側欄摘要，
  // 以及中間區塊的日曆（借閱日期／預計歸還／實際歸還都會顯示在日曆上）
  function renderContractAll(){

    renderMonth();

  // ---- 右側欄「合約借閱」摘要（借出中／逾期未還的合約，隨時可在工作排程畫面看到）----
  function loanSummaryItemHtml(l){
    const status = loanStatus(l);
    const dotClass = loanDotClass(status.key);
    const borrowerHtml = l.borrower ? `<span>${escapeHtml(l.borrower)}</span>` : '';
    const statusClass = status.key === 'overdue' ? 'u-top' : (status.key === 'soon' ? 'u-high' : 'u-normal');
    return `
      <div class="summary-item" data-id="${l.id}">
        <span class="dot ${dotClass}"></span>

          ${borrowerHtml}

          <button class="loan-edit-btn" data-id="${l.id}">編輯</button>
        </span>
      </div>`;
  }

  function renderLoanSidebar(){
    const list = loans.filter(l => !l.returnDate).sort(compareLoans);
    const rangeEl = document.getElementById('loanSidebarRange');
    if(rangeEl) rangeEl.textContent = list.length ? `借出中 ${list.length} 筆` : '';
    const container = document.getElementById('loanSidebarList');
    if(!container) return;
    container.innerHTML = list.length
      ? list.map(loanSummaryItemHtml).join('')
      : `<div class="summary-empty">目前沒有借出中的合約 🎉</div>`;
  }

  function compareByDeadline(a,b){
    if(a.deadline === b.deadline) return urgencyRank[a.urgency] - urgencyRank[b.urgency];
    if(!a.deadline) return 1;
    if(!b.deadline) return -1;
    return a.deadline < b.deadline ? -1 : 1;
  }
  function compareByUrgency(a,b){
    const r = urgencyRank[a.urgency] - urgencyRank[b.urgency];
    if(r !== 0) return r;
    return compareByDeadline(a,b);
  }

  // Tasks appear on the calendar in up to two places:
  //  - the day they were received (always, unless it coincides with the deadline day below)
  //  - the day they are due, tagged as a deadline occurrence ("🔥deadline")
  // Tasks with no deadline only show on their received day, plus the dedicated "不限期限" slot.
  function groupByDate(list){
    const map = {};
    function push(key, entry){
      if(!key) return;
      (map[key] = map[key] || []).push(entry);
    }
    list.forEach(t => {
      if(!t.deadline){
        push(t.received, { task:t, tag:'received' });
        return;
      }
      // if completed before the deadline, show the "second" occurrence on the
      // completion date instead of the deadline date
      let secondDate = t.deadline;
      let tag = 'deadline';
      if(t.done && t.completedAt && t.completedAt < t.deadline){
        secondDate = t.completedAt;
        tag = 'completed';
      }
      if(secondDate === t.received){
        push(t.received, { task:t, tag });
      }else{
        push(t.received, { task:t, tag:'received' });
        push(secondDate, { task:t, tag });
      }
    });
    Object.values(map).forEach(arr => arr.sort((a,b) => compareByUrgency(a.task,b.task)));
    return map;
  }

  const categoryClassMap = { '請假':'cat-leave', '會議':'cat-meeting', '公差':'cat-trip', '法務':'cat-legal', '合約借閱':'cat-loan' };
  function categoryClass(t){
    return categoryClassMap[t.category] || 'cat-none';
  }
  function urgencyDotHtml(t){
    return isSimpleCategory(t.category) ? '' : `<span class="dot dot-${t.urgency}"></span>`;
  }

  function chipHtml(entry, cellKey){
    const t = entry.task;
    let prefix = '';
    if(entry.tag === 'deadline') prefix = '🔥deadline ';
    else if(entry.tag === 'completed') prefix = '✅已完成 ';
    else if(entry.tag === 'loan-borrow') prefix = '📑借出 ';
    else if(entry.tag === 'loan-returned') prefix = '📥已還 ';
    else if(entry.tag === 'loan-expected') prefix = '⏳預計還 ';
    const label = `${prefix}${escapeHtml(t.title)}`;
    return `<span class="chip ${categoryClass(t)}${t.done?' done':''}${entry.tag==='deadline'?' chip-deadline':''}${entry.tag==='completed'?' chip-completed':''}" data-key="${cellKey}">${urgencyDotHtml(t)}<span class="label-text">${label}</span></span>`;
  }

  // ---- 合約借閱：併入中間區塊的日曆 ----
  // 借閱項目共用「工作類別」篩選機制：選「合約借閱」只顯示借閱項目，
  // 選其他類別則隱藏借閱項目，選「全部類別」則兩者同時顯示。
  function loanCategoryAllowed(){
    return categoryFilter === 'all' || categoryFilter === '合約借閱';
  }
  function matchesSearch(strList){
    const q = searchQuery.trim().toLowerCase();
    if(!q) return true;
    return strList.some(s => (s || '').toLowerCase().includes(q));
  }
  function filteredLoansForCalendar(){
    if(!loanCategoryAllowed()) return [];
    let list = loans.slice();
    if(filterMode === 'active') list = list.filter(l => !l.returnDate);
    if(filterMode === 'done') list = list.filter(l => !!l.returnDate);
    list = list.filter(l => matchesSearch([l.contract_name, l.borrower]));
    return list;
  }
  function loanPseudoTask(l){
    return { id:'loan-'+l.id, title:l.contract_name, category:'合約借閱', urgency:'normal', done:!!l.returnDate, __loan:l };
  }
  function addLoanEntriesToMap(map){
    function push(key, entry){
      if(!key) return;
      (map[key] = map[key] || []).push(entry);
    }
    filteredLoansForCalendar().forEach(l => {
      const pseudoTask = loanPseudoTask(l);
      push(l.loan_date, { task:pseudoTask, tag:'loan-borrow' });
      if(l.returnDate){
        if(l.returnDate !== l.loan_date) push(l.returnDate, { task:pseudoTask, tag:'loan-returned' });
      }else if(l.expectedReturn && l.expectedReturn !== l.loan_date){
        push(l.expectedReturn, { task:pseudoTask, tag:'loan-expected' });
      }
    });
    Object.values(map).forEach(arr => arr.sort((a,b) => compareByUrgency(a.task,b.task)));
  }

  function populateCalSelects(year, month){
    const yearSelect = document.getElementById('calYearSelect');
    const monthSelect = document.getElementById('calMonthSelect');
    const nowYear = new Date().getFullYear();
    let minYear = nowYear - 5, maxYear = nowYear + 5;
    if(year < minYear) minYear = year;
    if(year > maxYear) maxYear = year;
    let yearsHtml = '';
    for(let y=minYear; y<=maxYear; y++){
      yearsHtml += `<option value="${y}"${y===year?' selected':''}>${y} 年</option>`;
    }
    yearSelect.innerHTML = yearsHtml;
    let monthsHtml = '';
    for(let m=0;m<12;m++){
      monthsHtml += `<option value="${m}"${m===month?' selected':''}>${m+1} 月</option>`;
    }
    monthSelect.innerHTML = monthsHtml;
  }

  function renderMonth(){
    const list = filteredTasks();
    const map = groupByDate(list);
    addLoanEntriesToMap(map);
    const year = calRefDate.getFullYear();
    const month = calRefDate.getMonth();
    populateCalSelects(year, month);

    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
    const start = new Date(year, month, 1 - firstWeekday);
    const todayKey = dateKey(new Date());

    let html = '';
    for(let i=0;i<totalCells;i++){
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKey(d);
      const dayEntries = map[key] || [];
      const isOther = d.getMonth() !== month;
      const isToday = key === todayKey;
      const weekdayIdx = i % 7;
      const weekendClass = weekdayIdx === 0 ? ' sun' : (weekdayIdx === 6 ? ' sat' : '');
      const CHIP_LIMIT = 3;
      const shown = dayEntries.slice(0, CHIP_LIMIT);
      const restCount = dayEntries.length - shown.length;

      html += `
        <div class="cal-day${isOther?' other-month':''}${isToday?' today':''}${weekendClass}${dayEntries.length?' has-tasks':''}" data-key="${key}">
          <span class="num">${d.getDate()}</span>
          ${shown.map(entry => chipHtml(entry, key)).join('')}
          ${restCount > 0 ? `<span class="more-link" data-key="${key}">+${restCount} 更多</span>` : ''}
        </div>`;
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function openDayModal(key){
    modalDateKey = key;
    renderModal();
    document.getElementById('modalOverlay').style.display = 'flex';
  }
  function closeDayModal(){
    modalDateKey = null;
    document.getElementById('modalOverlay').style.display = 'none';
  }

  // ---- work item detail modal (sidebar summary lists) ----
  function openItemDetailModal(id){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    document.getElementById('itemDetailTitle').textContent = t.title;
    document.getElementById('itemDetailCards').innerHTML = cardHtml(t);

  function closeItemDetailModal(){
    document.getElementById('itemDetailModalOverlay').style.display = 'none';
  }
  function renderModal(){
    if(!modalDateKey) return;
    let list, loanList = [];
    const [y,m,d] = modalDateKey.split('-').map(Number);
    const dObj = new Date(y, m-1, d);
    document.getElementById('modalTitle').textContent = `${y}年${m}月${d}日 星期${weekdayNames[dObj.getDay()]}`;
    list = filteredTasks().filter(t => t.received === modalDateKey || t.deadline === modalDateKey || t.completedAt === modalDateKey).sort(compareByUrgency);
    loanList = filteredLoansForCalendar().filter(l => l.loan_date === modalDateKey || l.expectedReturn === modalDateKey || l.returnDate === modalDateKey).sort(compareLoans);

      ? `<div class="modal-empty">這天沒有符合目前篩選條件的工作</div>`
      : list.map(cardHtml).join('') + loanList.map(loanCardHtml).join('');

  // ---- work summary (this week / overdue-by-week) ----
  function getMonday(d){
    const m = new Date(d);
    m.setHours(0,0,0,0);
    const day = m.getDay(); // 0=Sun..6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    m.setDate(m.getDate() + diff);
    return m;
  }
  function weekNumberOfMonth(monday){
    return Math.floor((monday.getDate() - 1) / 7) + 1;
  }
  function fmtMD(d){ return `${d.getMonth()+1}/${d.getDate()}`; }

  function summaryItemHtml(t, dateStr, showDoneBtn){
    // 僅工作類別為「法務」的工作項目保留「標記完成」按鈕
    if(showDoneBtn === undefined) showDoneBtn = (t.category === '法務');
    const shownDate = dateStr || t.deadline || t.received;
    const isSimple = isSimpleCategory(t.category);
    const catHtml = t.category ? `<span class="category">${escapeHtml(t.category)}</span>` : '';
    const urgencyHtml = isSimple ? '' : `<span class="tag u-${t.urgency}">${urgencyLabel[t.urgency]}</span>`;
    const dotUrgency = isSimple ? 'normal' : t.urgency;
    const doneBtnHtml = showDoneBtn ? `<button class="done-btn" data-id="${t.id}">完成</button>` : '';
    const holdBtnHtml = `<button class="hold-btn${t.onHold ? ' active' : ''}" data-id="${t.id}">${t.onHold ? '取消暫緩' : '暫緩'}</button>`;
    const deadlineText = t.deadline ? fmtDate(t.deadline) : '不限';
    return `
      <div class="summary-item${t.onHold ? ' is-hold' : ''}" data-id="${t.id}">
        <span class="dot dot-${dotUrgency}"></span>
        <span class="si-title">${escapeHtml(t.title)}</span>
        <span class="si-meta">${catHtml}${urgencyHtml}<span class="si-date">${fmtDate(shownDate)}</span><span class="si-deadline">deadline：${deadlineText}</span></span>
        <span class="si-actions">
          ${doneBtnHtml}
          ${holdBtnHtml}
          <button class="edit-btn" data-id="${t.id}">編輯</button>
        </span>
      </div>`;
  }

  function renderSummary(){
    const todayMonday = getMonday(new Date());
    const weekEnd = new Date(todayMonday);
    weekEnd.setDate(todayMonday.getDate() + 6);
    const weekRangeStr = `${fmtMD(todayMonday)} - ${fmtMD(weekEnd)}`;
    document.getElementById('thisWeekRange').textContent = weekRangeStr;
    document.getElementById('thisWeekMeetingRange').textContent = weekRangeStr;
    document.getElementById('thisWeekTripRange').textContent = weekRangeStr;

    const pending = tasks.filter(t => !t.done && !t.onHold);
    const thisWeekEntries = []; // 法務：本週待辦工作
    const meetingEntries = [];  // 會議：本週會議事項
    const tripEntries = [];     // 公差：本週出差
    const overdueMap = {};      // 法務：未完成的工作項目（過去週數）

    pending.forEach(t => {
      const recMon = getMonday(parseDateLocal(t.received));
      const dlMon = t.deadline ? getMonday(parseDateLocal(t.deadline)) : null;
      const recIsThisWeek = recMon.getTime() === todayMonday.getTime();
      const dlIsThisWeek = dlMon && dlMon.getTime() === todayMonday.getTime();
      const isThisWeek = recIsThisWeek || dlIsThisWeek;
      const thisWeekDateStr = dlIsThisWeek ? t.deadline : t.received;

      // 本週會議事項：僅顯示類別為「會議」且落在本週的工作
      if(t.category === '會議'){
        if(isThisWeek) meetingEntries.push({ t, dateStr: thisWeekDateStr });
        return;
      }
      // 本週出差：僅顯示類別為「公差」且落在本週的工作
      if(t.category === '公差'){
        if(isThisWeek) tripEntries.push({ t, dateStr: thisWeekDateStr });
        return;
      }
      // 本週待辦工作 / 未完成的工作項目：顯示類別為「法務」或「其他」（未指定類別）的工作
      if(t.category !== '法務' && t.category !== '') return;

      if(isThisWeek){
        // 只要收到日期或截止日期落在本週，就算是本週待辦工作
        // 優先顯示截止日期（若也在本週），否則顯示收到日期
        thisWeekEntries.push({ t, dateStr: thisWeekDateStr });
        return;
      }

      // 不在本週範圍內：判斷是否為過期未完成，並決定要歸類到哪一週
      let bucketMon = null, bucketDateStr = null;
      if(dlMon && dlMon.getTime() < todayMonday.getTime()){
        bucketMon = dlMon; bucketDateStr = t.deadline;
      }else if(recMon.getTime() < todayMonday.getTime()){
        bucketMon = recMon; bucketDateStr = t.received;
      }
      if(!bucketMon) return; // 未來的工作，暫不顯示在總結欄位

      const y = bucketMon.getFullYear(), m = bucketMon.getMonth() + 1;
      const key = y + '-' + m;
      if(!overdueMap[key]) overdueMap[key] = { year:y, month:m, weeks:new Set(), entries:[], sortTime:new Date(y, m-1, 1).getTime() };
      overdueMap[key].weeks.add(weekNumberOfMonth(bucketMon));
      overdueMap[key].entries.push({ t, dateStr:bucketDateStr });
    });

    const byDateThenUrgency = (a,b) => {
      return a.dateStr === b.dateStr ? urgencyRank[a.t.urgency] - urgencyRank[b.t.urgency] : (a.dateStr < b.dateStr ? -1 : 1);
    };

    thisWeekEntries.sort(byDateThenUrgency);
    document.getElementById('thisWeekList').innerHTML = thisWeekEntries.length
      ? thisWeekEntries.map(e => summaryItemHtml(e.t, e.dateStr, true)).join('')
      : `<div class="summary-empty">本週沒有待辦工作 🎉</div>`;

    meetingEntries.sort(byDateThenUrgency);
    document.getElementById('thisWeekMeetingList').innerHTML = meetingEntries.length
      ? meetingEntries.map(e => summaryItemHtml(e.t, e.dateStr, false)).join('')
      : `<div class="summary-empty">本週沒有會議事項 🎉</div>`;

    tripEntries.sort(byDateThenUrgency);
    document.getElementById('thisWeekTripList').innerHTML = tripEntries.length
      ? tripEntries.map(e => summaryItemHtml(e.t, e.dateStr, false)).join('')
      : `<div class="summary-empty">本週沒有出差行程 🎉</div>`;

    const groups = Object.values(overdueMap).sort((a,b) => b.sortTime - a.sortTime);
    const groupsHtml = groups.map(g => {
      const weeksArr = Array.from(g.weeks).sort((x,y) => x - y);
      const weekLabel = weeksArr.length > 1
        ? `第${weeksArr[0]}~${weeksArr[weeksArr.length-1]}週`
        : `第${weeksArr[0]}週`;
      const entriesSorted = g.entries.sort(byDateThenUrgency);
      return `
        <div class="overdue-group">
          <div class="og-head">${g.month}月 ${weekLabel}<span class="og-count">${entriesSorted.length}</span></div>
          <div class="og-list">${entriesSorted.map(e => summaryItemHtml(e.t, e.dateStr, true)).join('')}</div>
        </div>`;
    }).join('');
    document.getElementById('overdueGroups').innerHTML = groups.length
      ? groupsHtml
      : `<div class="summary-empty">沒有未完成的過期工作 🎉</div>`;

    const onHoldEntries = tasks
      .filter(t => t.onHold && !t.done)
      .map(t => ({ t, dateStr: t.deadline || t.received }));
    onHoldEntries.sort(byDateThenUrgency);
    document.getElementById('onHoldList').innerHTML = onHoldEntries.length
      ? onHoldEntries.map(e => summaryItemHtml(e.t, e.dateStr, true)).join('')
      : `<div class="summary-empty">目前沒有暫緩中的工作</div>`;
  }

    const category = categoryInput.value;
    const isSimple = isSimpleCategory(category);

    const deadline = isUnlimited ? null : deadlineInput.value;
    const urgency = isSimple ? 'normal' : document.querySelector('input[name="urgency"]:checked').value;

    if(!title || !received) return;
    if(!isUnlimited && !deadline) return;

    if(editingId){
      // ---- edit existing task ----
      const id = editingId;
      const t = tasks.find(x => x.id === id);
      if(!t) return;
      const prev = { title:t.title, source:t.source, progress:t.progress, category:t.category, received:t.received, deadline:t.deadline, urgency:t.urgency };
      t.title = title; t.source = source; t.progress = progress; t.category = category; t.received = received; t.deadline = deadline; t.urgency = urgency;
      saveLocalBackup();
      closeTaskModal();
      renderAll();

      const { error, missingCols } = await resilientWrite(TABLE, 'update', { title, source, progress, category, received, deadline, urgency }, id);
      warnMissingColumns(missingCols);
      if(error){
        console.error('更新到 Supabase 失敗：', error);
        alert('儲存修改失敗，請檢查網路連線或 Supabase 設定。');
        Object.assign(t, prev);
        saveLocalBackup();
        renderAll();
      }
    }else{
      // ---- add new task ----
      const newTask = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        title, source, progress, category, received, deadline, urgency, done:false,
        completedAt:null, completeNote:'', onHold:false, holdNote:''
      };
      tasks.push(newTask);
      saveLocalBackup();
      closeTaskModal();
      renderAll();

      const { error, missingCols } = await resilientWrite(TABLE, 'insert', {
        id:newTask.id, title, source, progress, category, received, deadline, urgency, done:false,
        completed_at:null, complete_note:'', on_hold:false, hold_note:''
      });
      warnMissingColumns(missingCols);
      if(error){
        console.error('新增到 Supabase 失敗：', error);
        alert('新增失敗，請檢查網路連線或 Supabase 設定。');
        tasks = tasks.filter(t => t.id !== newTask.id);
        saveLocalBackup();
        renderAll();
      }
    }
  });

      saveLocalBackup();
      renderAll();

  const loanBorrowerInput = document.getElementById('loanBorrower');
  const loanDepartmentInput = document.getElementById('loanDepartment');
  const loanDateInput = document.getElementById('loanDate');
  const loanExpectedReturnInput = document.getElementById('loanExpectedReturn');
  const loanExpectedUnlimited = document.getElementById('loanExpectedUnlimited');
  const loanPurposeInput = document.getElementById('loanPurpose');
  const loanNoteInput = document.getElementById('loanNote');
  const loanModalOverlay = document.getElementById('loanModalOverlay');
  const loanFormTitleEl = document.getElementById('loanFormTitle');
  const loanSubmitBtn = document.getElementById('loanSubmitBtn');
  const loanCancelEditBtn = document.getElementById('loanCancelEditBtn');
  const loanPanelEl = loanModalOverlay.querySelector('.panel');

  loanDateInput.value = toLocalDateValue(new Date());
  document.getElementById('loanNowBtn').addEventListener('click', () => {
    loanDateInput.value = toLocalDateValue(new Date());
  });
  loanExpectedUnlimited.addEventListener('change', () => {
    if(loanExpectedUnlimited.checked){
      loanExpectedReturnInput.value = '';
      loanExpectedReturnInput.disabled = true;
    }else{
      loanExpectedReturnInput.disabled = false;
    }
  });

  function openLoanModal(){ loanModalOverlay.style.display = 'flex'; }
  function closeLoanModal(){ loanModalOverlay.style.display = 'none'; resetLoanFormToAddMode(); }

  function resetLoanFormToAddMode(){
    editingLoanId = null;
    document.getElementById('loanForm').reset();
    loanDateInput.value = toLocalDateValue(new Date());
    loanExpectedUnlimited.checked = false;
    loanExpectedReturnInput.disabled = false;
    loanFormTitleEl.textContent = '新增借閱紀錄';
    loanSubmitBtn.textContent = '新增借閱紀錄';
    loanCancelEditBtn.style.display = 'none';
    loanPanelEl.classList.remove('editing');
  }

  document.getElementById('openAddLoanBtn').addEventListener('click', () => {
    resetLoanFormToAddMode();
    openLoanModal();
    loanContractNameInput.focus();
  });
  document.getElementById('loanModalClose').addEventListener('click', closeLoanModal);
  loanModalOverlay.addEventListener('click', (e) => {
    if(e.target.id === 'loanModalOverlay') closeLoanModal();
  });
  loanCancelEditBtn.addEventListener('click', closeLoanModal);

  function startEditLoan(id){
    const l = loans.find(x => x.id === id);
    if(!l) return;
    editingLoanId = id;
    loanContractNameInput.value = l.contract_name;
    loanBorrowerInput.value = l.borrower;
    loanDepartmentInput.value = l.department || '';
    loanDateInput.value = l.loan_date;
    if(l.expectedReturn){
      loanExpectedUnlimited.checked = false;
      loanExpectedReturnInput.disabled = false;
      loanExpectedReturnInput.value = l.expectedReturn;
    }else{
      loanExpectedUnlimited.checked = true;
      loanExpectedReturnInput.disabled = true;
      loanExpectedReturnInput.value = '';
    }
    loanPurposeInput.value = l.purpose || '';
    loanNoteInput.value = l.note || '';
    loanFormTitleEl.textContent = '編輯借閱紀錄';
    loanSubmitBtn.textContent = '儲存修改';
    loanCancelEditBtn.style.display = 'block';
    loanPanelEl.classList.add('editing');
    openLoanModal();
    loanContractNameInput.focus();
  }

  document.getElementById('loanForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const contract_name = loanContractNameInput.value.trim();
    const borrower = loanBorrowerInput.value.trim();
    const department = loanDepartmentInput.value.trim();
    const loan_date = loanDateInput.value;
    const isUnlimited = loanExpectedUnlimited.checked;
    const expected_return = isUnlimited ? null : loanExpectedReturnInput.value;
    const purpose = loanPurposeInput.value.trim();
    const note = loanNoteInput.value.trim();

    if(!contract_name || !borrower || !loan_date) return;
    if(!isUnlimited && !expected_return) return;

    if(editingLoanId){
      // ---- edit existing loan ----
      const id = editingLoanId;
      const l = loans.find(x => x.id === id);
      if(!l) return;
      const prev = { contract_name:l.contract_name, borrower:l.borrower, department:l.department, loan_date:l.loan_date, expectedReturn:l.expectedReturn, purpose:l.purpose, note:l.note };
      l.contract_name = contract_name; l.borrower = borrower; l.department = department;
      l.loan_date = loan_date; l.expectedReturn = expected_return; l.purpose = purpose; l.note = note;
      saveLoanLocalBackup();
      closeLoanModal();
      renderContractAll();

      const { error, missingCols } = await resilientWrite(LOAN_TABLE, 'update', { contract_name, borrower, department, loan_date, expected_return, purpose, note }, id);
      warnMissingColumns(missingCols);
      if(error){
        console.error('更新合約借閱資料失敗：', error);
        alert('儲存修改失敗，請檢查網路連線，或確認 Supabase 是否已建立 contract_loans 資料表。');
        Object.assign(l, prev);
        saveLoanLocalBackup();
        renderContractAll();
      }
    }else{
      // ---- add new loan ----
      const newLoan = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        contract_name, borrower, department, loan_date, expectedReturn:expected_return,
        purpose, note, returnDate:null, returnNote:''
      };
      loans.push(newLoan);
      saveLoanLocalBackup();
      closeLoanModal();
      renderContractAll();

      const { error, missingCols } = await resilientWrite(LOAN_TABLE, 'insert', {
        id:newLoan.id, contract_name, borrower, department, loan_date, expected_return, purpose, note,
        return_date:null, return_note:''
      });
      warnMissingColumns(missingCols);
      if(error){
        console.error('新增合約借閱資料失敗：', error);
        alert('新增失敗，請檢查網路連線，或確認 Supabase 是否已建立 contract_loans 資料表。');
        loans = loans.filter(l => l.id !== newLoan.id);
        saveLoanLocalBackup();
        renderContractAll();
      }
    }
  });

  // ---- 標記歸還 modal ----
  const loanReturnModalOverlay = document.getElementById('loanReturnModalOverlay');
  const loanReturnDateInput = document.getElementById('loanReturnDate');
  const loanReturnNoteInput = document.getElementById('loanReturnNote');

  function openLoanReturnModal(id){
    pendingReturnLoanId = id;
    loanReturnDateInput.value = toLocalDateValue(new Date());
    loanReturnNoteInput.value = '';
    loanReturnModalOverlay.style.display = 'flex';
  }
  function closeLoanReturnModal(){
    pendingReturnLoanId = null;
    loanReturnModalOverlay.style.display = 'none';
  }

  async function toggleLoanReturn(id){
    const l = loans.find(x => x.id === id);
    if(!l) return;
    if(!l.returnDate){
      openLoanReturnModal(id);
      return;
    }
    // 取消歸還：清除歸還資訊
    const prev = { returnDate:l.returnDate, returnNote:l.returnNote };
    l.returnDate = null;
    l.returnNote = '';
    saveLoanLocalBackup();
    renderContractAll();
    const { error, missingCols } = await resilientWrite(LOAN_TABLE, 'update', { return_date:null, return_note:null }, id);
    warnMissingColumns(missingCols);
    if(error){
      console.error('更新合約借閱資料失敗：', error);
      alert('更新失敗，請檢查網路連線或 Supabase 設定。');
      Object.assign(l, prev);
      saveLoanLocalBackup();
      renderContractAll();
    }
  }

  document.getElementById('loanReturnForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if(!pendingReturnLoanId) return;
    const id = pendingReturnLoanId;
    const l = loans.find(x => x.id === id);
    if(!l) return;
    const returnDate = loanReturnDateInput.value;
    const returnNote = loanReturnNoteInput.value.trim();
    if(!returnDate) return;

    const prev = { returnDate:l.returnDate, returnNote:l.returnNote };
    l.returnDate = returnDate;
    l.returnNote = returnNote;
    saveLoanLocalBackup();
    closeLoanReturnModal();
    renderContractAll();

    const { error, missingCols } = await resilientWrite(LOAN_TABLE, 'update', { return_date:returnDate, return_note:returnNote }, id);
    warnMissingColumns(missingCols);
    if(error){
      console.error('更新合約借閱資料失敗：', error);
      alert('更新失敗，請檢查網路連線或 Supabase 設定。');
      Object.assign(l, prev);
      saveLoanLocalBackup();
      renderContractAll();
    }
  });
  document.getElementById('loanReturnModalClose').addEventListener('click', closeLoanReturnModal);
  document.getElementById('loanReturnCancelBtn').addEventListener('click', closeLoanReturnModal);
  loanReturnModalOverlay.addEventListener('click', (e) => {
    if(e.target.id === 'loanReturnModalOverlay') closeLoanReturnModal();
  });

  async function deleteLoan(id){
    if(!confirm('確定要刪除這筆合約借閱紀錄嗎？')) return;
    const removed = loans.find(x => x.id === id);
    loans = loans.filter(x => x.id !== id);
    if(editingLoanId === id) closeLoanModal();
    saveLoanLocalBackup();
    renderContractAll();
    const { error } = await sb.from(LOAN_TABLE).delete().eq('id', id);
    if(error){
      console.error('刪除合約借閱資料失敗：', error);
      alert('刪除失敗，請檢查網路連線或 Supabase 設定。');
      if(removed){ loans.push(removed); saveLoanLocalBackup(); renderContractAll(); }
    }
  }

  document.addEventListener('click', (e) => {
    const returnBtn = e.target.closest('.loan-return-btn');
    const editBtn = e.target.closest('.loan-edit-btn');
    const delBtn = e.target.closest('.loan-del-btn');
    if(returnBtn){ toggleLoanReturn(returnBtn.dataset.id); }
    if(editBtn){ startEditLoan(editBtn.dataset.id); }
    if(delBtn){ deleteLoan(delBtn.dataset.id); }
  });

  // refresh periodically so overdue badges / calendar stay live
  setInterval(() => { renderAll(); renderContractAll(); }, 60000);

  (async function init(){
    await load();
    await loadLoans();
    renderAll();
    renderContractAll();
  })();
})();
</script>
</body>
</html>
