<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INA-working schedule💣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2333;
    --ink-soft:#4A5164;
    --paper:#F5F6F4;
    --card:#FFFFFF;
    --muted:#8A93A6;
    --line:#E3E5E0;
    --teal:#2F6F5E;
    --teal-deep:#204F42;
    --amber:#E2A63B;
    --amber-bg:#FCF2DE;
    --red:#C6413A;
    --red-bg:#FBE7E5;
    --low-bg:#EDF1EF;
    --note-bg:#ECEDF1;
    --note-text:#5B6472;
    --note-line:#C7CCD6;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,35,51,0.04), 0 4px 14px rgba(28,35,51,0.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }

  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--card);
    padding:22px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    display:inline-block;
    width:10px;height:10px;
    background:var(--teal);
    border-radius:2px;
    transform:rotate(45deg);
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .stat-strip{
    display:flex;
    gap:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-strip b{
    font-size:16px;
    font-family:'Space Grotesk',sans-serif;
    color:var(--ink);
    display:block;
    line-height:1.1;
  }
  .stat-strip .stat{ min-width:52px; }
  .stat-strip .stat.warn b{ color:var(--red); }

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:0;
    align-items:start;
    max-width:1320px;
    margin:0 auto;
  }

  /* ---- form panel ---- */
  .panel{
    border-right:1px solid var(--line);
    padding:28px 24px;
    position:sticky;
    top:73px;
    height:calc(100vh - 73px);
    overflow-y:auto;
  }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 4px;
  }
  .panel .hint{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  .field textarea,
  .field input,
  .field select{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input[type="date"]{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .field input[type="date"]:disabled{
    background:var(--paper);
    color:var(--muted);
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
    font-family:'Inter',sans-serif;
  }
  .field textarea:focus,
  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(47,111,94,0.12);
  }
  .field .row{ display:flex; gap:8px; align-items:center; }
  .field .row input[type="date"]{ flex:1; }
  .field .row button{
    flex:none;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--teal-deep);
    background:var(--low-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
  }
  .field .row button:hover{ background:#dfe9e5; }

  .unlimited-toggle{
    flex:none;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
  }
  .unlimited-toggle input[type="checkbox"]{
    width:auto;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .urgency-picker{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .urgency-picker input{ display:none; }
  .urgency-picker label{
    text-align:center;
    padding:8px 2px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
    background:var(--card);
    transition:all .15s ease;
  }
  .urgency-picker input:checked + label.u-top{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .urgency-picker input:checked + label.u-high{ background:var(--amber-bg); border-color:var(--amber); color:#8a6415; }
  .urgency-picker input:checked + label.u-normal{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .urgency-picker input:checked + label.u-note{ background:var(--note-bg); border-color:var(--note-line); color:var(--note-text); }

  .submit-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:12px 0;
    font-size:13.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--teal-deep); }

  /* ---- main list ---- */
  .main{ padding:28px 28px 60px; }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .list-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0;
  }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:var(--card);
  }
  .seg button{
    border:none;
    background:transparent;
    padding:7px 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--ink); color:#fff; }

  .source-select{
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--card);
    padding:0 10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    height:32px;
  }
  .source-select:focus{ outline:none; border-color:var(--teal); }

  .empty{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .empty .big{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .cards{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:grid;
    grid-template-columns:5px 1fr auto;
    gap:16px;
    align-items:start;
    position:relative;
  }
  .card .stripe{
    align-self:stretch;
    border-radius:4px;
    background:var(--low-bg);
  }
  .card.u-top .stripe{ background:var(--red); }
  .card.u-high .stripe{ background:var(--amber); }
  .card.u-normal .stripe{ background:var(--teal); }
  .card.u-note .stripe{ background:var(--note-line); }

  .card.done{ opacity:0.55; }
  .card.done .title{ text-decoration:line-through; color:var(--muted); }

  .card .body{ min-width:0; }
  .title{
    font-size:14.5px;
    font-weight:600;
    margin:0 0 6px;
    word-break:break-word;
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    align-items:center;
  }
  .meta .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    border:1px solid var(--line);
  }
  .tag.u-top{ background:var(--red-bg); color:var(--red); border-color:transparent; }
  .tag.u-high{ background:var(--amber-bg); color:#8a6415; border-color:transparent; }
  .tag.u-normal{ background:var(--low-bg); color:var(--teal-deep); border-color:transparent; }
  .tag.u-note{ background:var(--note-bg); color:var(--note-text); border-color:transparent; }
  .meta .source{
    padding:2px 8px;
    border-radius:20px;
    background:#EEF0FB;
    color:#4A4FB0;
    font-weight:600;
  }

  .badge{
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .badge.overdue{ background:var(--red); color:#fff; }
  .badge.soon{ background:var(--amber); color:#4a3510; }
  .badge.ok{ background:var(--low-bg); color:var(--ink-soft); }
  .badge.unlimited{ background:var(--note-bg); color:var(--note-text); }

  .actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-self:center;
  }
  .actions button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    padding:6px 12px;
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .actions .done-btn:hover{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .actions .del-btn:hover{ background:var(--red-bg); border-color:var(--red); color:var(--red); }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .cal-nav .label{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    min-width:150px;
  }
  .nav-btn{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    width:30px; height:30px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .nav-btn:hover{ background:var(--low-bg); }
  .today-btn{
    width:auto;
    padding:0 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:auto;
  }

  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .cal-weekdays span{
    text-align:center;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    padding-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px;
    min-height:96px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cal-day.has-tasks{ cursor:pointer; }
  .cal-day.has-tasks:hover{ border-color:var(--teal); }
  .cal-day.other-month{ opacity:0.38; }
  .cal-day.today{ border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset; }
  .cal-day .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .cal-day.today .num{ color:var(--teal-deep); }

  .chip{
    font-size:10.5px;
    padding:2px 6px;
    border-radius:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .chip.u-top{ background:var(--red-bg); color:var(--red); }
  .chip.u-high{ background:var(--amber-bg); color:#8a6415; }
  .chip.u-normal{ background:var(--low-bg); color:var(--teal-deep); }
  .chip.u-note{ background:var(--note-bg); color:var(--note-text); }
  .chip.done{ text-decoration:line-through; opacity:0.55; }
  .more-link{
    font-size:10px;
    color:var(--muted);
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .more-link:hover{ color:var(--teal-deep); }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(28,35,51,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-box{
    background:var(--card);
    border-radius:12px;
    max-width:560px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    padding:22px;
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .modal-head h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    margin:0;
  }
  .modal-close{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    width:28px; height:28px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .modal-close:hover{ background:var(--low-bg); }
  .modal-box .cards{ gap:10px; }
  .modal-empty{ color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }

  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
    .panel{
      position:static;
      height:auto;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .card{
      grid-template-columns:5px 1fr;
    }
    .actions{
      grid-column:1 / -1;
      flex-direction:row;
      justify-content:flex-end;
      margin-top:8px;
    }
    .stat-strip{ display:none; }
    .cal-day{ min-height:64px; padding:5px; }
    .chip{ font-size:9.5px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark"></span>INA-working schedule💣</div>
  <div class="stat-strip">
    <div class="stat"><b id="statTotal">0</b>總計</div>
    <div class="stat"><b id="statActive">0</b>進行中</div>
    <div class="stat warn"><b id="statOverdue">0</b>已逾期</div>
  </div>
</div>

<div class="layout">
  <!-- FORM -->
  <div class="panel">
    <h2>新增工作</h2>
    <p class="hint">填寫後按下方按鈕加入清單</p>
    <form id="taskForm">
      <div class="field">
        <label for="title">工作名稱 / 內容說明</label>
        <textarea id="title" required placeholder="例：完成 Q3 財報彙整"></textarea>
      </div>

      <div class="field">
        <label for="source">工作來源</label>
        <input type="text" id="source" placeholder="例：主管指派、客戶來信、系統派工">
      </div>

      <div class="field">
        <label for="received">收到工作的日期</label>
        <div class="row">
          <input type="date" id="received" required>
          <button type="button" id="nowBtn">今天</button>
        </div>
      </div>

      <div class="field">
        <label>緊急程度</label>
        <div class="urgency-picker">
          <input type="radio" name="urgency" id="u-top" value="top">
          <label class="u-top" for="u-top">最急件</label>
          <input type="radio" name="urgency" id="u-high" value="high">
          <label class="u-high" for="u-high">急件</label>
          <input type="radio" name="urgency" id="u-normal" value="normal" checked>
          <label class="u-normal" for="u-normal">普通件</label>
          <input type="radio" name="urgency" id="u-note" value="note">
          <label class="u-note" for="u-note">備註</label>
        </div>
      </div>

      <div class="field">
        <label for="deadline">結案日期</label>
        <div class="row">
          <input type="date" id="deadline" required>
          <label class="unlimited-toggle"><input type="checkbox" id="deadlineUnlimited"> 不限</label>
        </div>
      </div>

      <button type="submit" class="submit-btn">加入工作清單</button>
    </form>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="list-head">
      <h1>所有工作</h1>
      <div class="controls">
        <div class="seg" id="filterSeg">
          <button data-filter="active" class="active">進行中</button>
          <button data-filter="all">全部</button>
          <button data-filter="done">已完成</button>
        </div>
        <div class="seg" id="urgencySeg">
          <button data-urgency="all" class="active">全部緊急度</button>
          <button data-urgency="top">最急件</button>
          <button data-urgency="high">急件</button>
          <button data-urgency="normal">普通件</button>
          <button data-urgency="note">備註</button>
        </div>
        <select id="sourceFilter" class="source-select">
          <option value="all">全部來源</option>
        </select>
      </div>
    </div>

    <!-- calendar view -->
    <div id="calendarWrap">
      <div class="cal-nav">
        <button class="nav-btn" id="calPrev">←</button>
        <div class="label" id="calLabel"></div>
        <button class="nav-btn" id="calNext">→</button>
        <button class="nav-btn today-btn" id="calToday">今天</button>
      </div>

      <div id="monthView">
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- day detail modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="cards" id="modalCards"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ==== Supabase 設定：請填入你自己專案的 Project URL 與 anon public key ====
  const SUPABASE_URL = 'https://svcsjkvzzddimfqjxwvj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_-mDe3WCxiH3lJ_Awh9TBkQ_XNM34QFY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const TABLE = 'tasks';

  const STORAGE_KEY = 'worklog.tasks.v1';
  const urgencyLabel = { top:'最急件', high:'急件', normal:'普通件', note:'備註' };
  const urgencyRank = { top:0, high:1, normal:2, note:3 };
  const weekdayNames = ['日','一','二','三','四','五','六'];

  let tasks = [];
  let filterMode = 'active';
  let urgencyFilter = 'all';
  let sourceFilter = 'all';
  let calRefDate = new Date();
  let modalDateKey = null;

  async function load(){
    try{
      const { data, error } = await sb.from(TABLE).select('*').order('received', { ascending:false });
      if(error) throw error;
      tasks = data || [];
      tasks.forEach(t => {
        if(t.source === undefined || t.source === null) t.source = '';
        // migrate old urgency values (high/mid/low) to new scheme
        if(t.urgency === 'mid') t.urgency = 'normal';
        if(t.urgency === 'low') t.urgency = 'note';
        if(!urgencyLabel[t.urgency]) t.urgency = 'normal';
        // migrate old datetime values to date-only
        if(t.received && t.received.includes('T')) t.received = t.received.split('T')[0];
        if(t.deadline && typeof t.deadline === 'string' && t.deadline.includes('T')) t.deadline = t.deadline.split('T')[0];
      });
    }catch(e){
      console.error('讀取 Supabase 資料失敗，改用本機備份：', e);
      // 連不到 Supabase 時，退回舊的 localStorage 備份，避免資料完全無法顯示
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
      }catch(e2){ tasks = []; }
    }
  }
  // 本機備份，主要資料以 Supabase 為主，localStorage 只作離線保險
  function saveLocalBackup(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function pad(n){ return String(n).padStart(2,'0'); }
  function toLocalDateValue(d){
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function parseDateLocal(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function fmtDate(dateStr){
    if(!dateStr) return '不限';
    const [y,m,d] = dateStr.split('-');
    return `${y}/${m}/${d}`;
  }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // default received = today
  const receivedInput = document.getElementById('received');
  receivedInput.value = toLocalDateValue(new Date());
  document.getElementById('nowBtn').addEventListener('click', () => {
    receivedInput.value = toLocalDateValue(new Date());
  });

  // deadline "不限" toggle
  const deadlineInput = document.getElementById('deadline');
  const deadlineUnlimited = document.getElementById('deadlineUnlimited');
  deadlineUnlimited.addEventListener('change', () => {
    if(deadlineUnlimited.checked){
      deadlineInput.value = '';
      deadlineInput.disabled = true;
      deadlineInput.required = false;
    }else{
      deadlineInput.disabled = false;
      deadlineInput.required = true;
    }
  });

  function deadlineStatus(deadlineStr, done){
    if(done) return { key:'done' };
    if(!deadlineStr) return { key:'unlimited', label:'不限期限' };
    const dl = parseDateLocal(deadlineStr);
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((dl - today) / 86400000);
    if(diffDays < 0) return { key:'overdue', label:'已逾期' };
    if(diffDays <= 1) return { key:'soon', label:'即將到期' };
    return { key:'ok', label:'尚有餘裕' };
  }

  function filteredTasks(){
    let list = tasks.slice();
    if(filterMode === 'active') list = list.filter(t => !t.done);
    if(filterMode === 'done') list = list.filter(t => t.done);
    if(urgencyFilter !== 'all') list = list.filter(t => t.urgency === urgencyFilter);
    if(sourceFilter !== 'all') list = list.filter(t => (t.source || '(未填寫來源)') === sourceFilter);
    return list;
  }

  function renderSourceOptions(){
    const sel = document.getElementById('sourceFilter');
    const sources = Array.from(new Set(tasks.map(t => t.source && t.source.trim() ? t.source.trim() : '(未填寫來源)'))).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    const prev = sourceFilter;
    sel.innerHTML = `<option value="all">全部來源</option>` +
      sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    // keep current selection if it still exists among sources, else reset to all
    if(prev !== 'all' && sources.includes(prev)){
      sel.value = prev;
    }else{
      sourceFilter = 'all';
      sel.value = 'all';
    }
  }

  function cardHtml(t){
    const status = deadlineStatus(t.deadline, t.done);
    let badgeHtml = '';
    if(!t.done){
      if(status.key === 'overdue') badgeHtml = `<span class="badge overdue">⚠ ${status.label}</span>`;
      else if(status.key === 'soon') badgeHtml = `<span class="badge soon">⏰ ${status.label}</span>`;
      else if(status.key === 'unlimited') badgeHtml = `<span class="badge unlimited">${status.label}</span>`;
      else badgeHtml = `<span class="badge ok">${status.label}</span>`;
    }
    const sourceHtml = t.source ? `<span class="source">來源：${escapeHtml(t.source)}</span>` : '';
    return `
      <div class="card u-${t.urgency}${t.done ? ' done' : ''}">
        <div class="stripe"></div>
        <div class="body">
          <p class="title">${escapeHtml(t.title)}</p>
          <div class="meta">
            <span class="tag u-${t.urgency}">${urgencyLabel[t.urgency]}</span>
            ${sourceHtml}
            <span>收到：${fmtDate(t.received)}</span>
            <span>結案：${fmtDate(t.deadline)}</span>
            ${badgeHtml}
          </div>
        </div>
        <div class="actions">
          <button class="done-btn" data-id="${t.id}">${t.done ? '取消完成' : '標記完成'}</button>
          <button class="del-btn" data-id="${t.id}">刪除</button>
        </div>
      </div>`;
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = tasks.length;
    document.getElementById('statActive').textContent = tasks.filter(t=>!t.done).length;
    document.getElementById('statOverdue').textContent = tasks.filter(t=>!t.done && deadlineStatus(t.deadline,false).key==='overdue').length;
  }

  function compareByDeadline(a,b){
    if(a.deadline === b.deadline) return urgencyRank[a.urgency] - urgencyRank[b.urgency];
    if(!a.deadline) return 1;
    if(!b.deadline) return -1;
    return a.deadline < b.deadline ? -1 : 1;
  }
  function compareByUrgency(a,b){
    const r = urgencyRank[a.urgency] - urgencyRank[b.urgency];
    if(r !== 0) return r;
    return compareByDeadline(a,b);
  }

  // tasks with a deadline are grouped under their deadline date;
  // tasks with an unlimited (empty) deadline are grouped under the date they were received
  function taskCalendarKey(t){
    return t.deadline || t.received;
  }
  function groupByDate(list){
    const map = {};
    list.forEach(t => {
      const key = taskCalendarKey(t);
      if(!key) return;
      (map[key] = map[key] || []).push(t);
    });
    Object.values(map).forEach(arr => arr.sort(compareByUrgency));
    return map;
  }

  function chipHtml(t){
    return `<span class="chip u-${t.urgency}${t.done?' done':''}" data-key="${taskCalendarKey(t)}">${escapeHtml(t.title)}</span>`;
  }

  function renderMonth(){
    const list = filteredTasks();
    const map = groupByDate(list);
    const year = calRefDate.getFullYear();
    const month = calRefDate.getMonth();
    document.getElementById('calLabel').textContent = `${year} 年 ${month+1} 月`;

    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
    const start = new Date(year, month, 1 - firstWeekday);
    const todayKey = dateKey(new Date());

    let html = '';
    for(let i=0;i<totalCells;i++){
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKey(d);
      const dayTasks = map[key] || [];
      const isOther = d.getMonth() !== month;
      const isToday = key === todayKey;
      const CHIP_LIMIT = 3;
      const shown = dayTasks.slice(0, CHIP_LIMIT);
      const restCount = dayTasks.length - shown.length;

      html += `
        <div class="cal-day${isOther?' other-month':''}${isToday?' today':''}${dayTasks.length?' has-tasks':''}" data-key="${key}">
          <span class="num">${d.getDate()}</span>
          ${shown.map(t => chipHtml(t)).join('')}
          ${restCount > 0 ? `<span class="more-link" data-key="${key}">+${restCount} 更多</span>` : ''}
        </div>`;
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function openDayModal(key){
    modalDateKey = key;
    renderModal();
    document.getElementById('modalOverlay').style.display = 'flex';
  }
  function closeDayModal(){
    modalDateKey = null;
    document.getElementById('modalOverlay').style.display = 'none';
  }
  function renderModal(){
    if(!modalDateKey) return;
    const [y,m,d] = modalDateKey.split('-').map(Number);
    const dObj = new Date(y, m-1, d);
    document.getElementById('modalTitle').textContent = `${y}年${m}月${d}日 星期${weekdayNames[dObj.getDay()]}`;
    const list = filteredTasks().filter(t => taskCalendarKey(t) === modalDateKey).sort(compareByUrgency);
    const modalCards = document.getElementById('modalCards');
    modalCards.innerHTML = list.length === 0
      ? `<div class="modal-empty">這天沒有符合目前篩選條件的工作</div>`
      : list.map(cardHtml).join('');
  }

  function renderAll(){
    renderSourceOptions();
    renderMonth();
    renderStats();
    if(modalDateKey) renderModal();
  }

  // ---- form submit ----
  document.getElementById('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const source = document.getElementById('source').value.trim();
    const received = receivedInput.value;
    const isUnlimited = deadlineUnlimited.checked;
    const deadline = isUnlimited ? null : deadlineInput.value;
    const urgency = document.querySelector('input[name="urgency"]:checked').value;

    if(!title || !received) return;
    if(!isUnlimited && !deadline) return;

    const newTask = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      title, source, received, deadline, urgency, done:false
    };
    tasks.push(newTask);
    saveLocalBackup();
    renderAll();

    e.target.reset();
    receivedInput.value = toLocalDateValue(new Date());
    document.getElementById('u-normal').checked = true;
    deadlineUnlimited.checked = false;
    deadlineInput.disabled = false;
    deadlineInput.required = true;

    const { error } = await sb.from(TABLE).insert(newTask);
    if(error){
      console.error('新增到 Supabase 失敗：', error);
      alert('新增失敗，請檢查網路連線或 Supabase 設定。');
      tasks = tasks.filter(t => t.id !== newTask.id);
      saveLocalBackup();
      renderAll();
    }
  });

  // ---- shared action handling (list cards + modal cards) ----
  async function toggleDone(id){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    const prev = t.done;
    t.done = !t.done;
    saveLocalBackup();
    renderAll();
    const { error } = await sb.from(TABLE).update({ done: t.done }).eq('id', id);
    if(error){
      console.error('更新 Supabase 失敗：', error);
      alert('更新失敗，請檢查網路連線或 Supabase 設定。');
      t.done = prev;
      saveLocalBackup();
      renderAll();
    }
  }
  async function deleteTask(id){
    if(!confirm('確定要刪除這筆工作紀錄嗎？')) return;
    const removed = tasks.find(x => x.id === id);
    tasks = tasks.filter(x => x.id !== id);
    saveLocalBackup();
    renderAll();
    const { error } = await sb.from(TABLE).delete().eq('id', id);
    if(error){
      console.error('刪除 Supabase 資料失敗：', error);
      alert('刪除失敗，請檢查網路連線或 Supabase 設定。');
      if(removed){ tasks.push(removed); saveLocalBackup(); renderAll(); }
    }
  }
  document.addEventListener('click', (e) => {
    const doneBtn = e.target.closest('.done-btn');
    const delBtn = e.target.closest('.del-btn');
    if(doneBtn){ toggleDone(doneBtn.dataset.id); }
    if(delBtn){ deleteTask(delBtn.dataset.id); }
  });

  // ---- filters ----
  document.getElementById('filterSeg').addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON') return;
    filterMode = e.target.dataset.filter;
    [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b===e.target));
    renderAll();
  });
  document.getElementById('urgencySeg').addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON') return;
    urgencyFilter = e.target.dataset.urgency;
    [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b===e.target));
    renderAll();
  });
  document.getElementById('sourceFilter').addEventListener('change', (e) => {
    sourceFilter = e.target.value;
    renderAll();
  });

  // ---- calendar nav (month only) ----
  document.getElementById('calPrev').addEventListener('click', () => {
    calRefDate = new Date(calRefDate.getFullYear(), calRefDate.getMonth()-1, 1);
    renderAll();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calRefDate = new Date(calRefDate.getFullYear(), calRefDate.getMonth()+1, 1);
    renderAll();
  });
  document.getElementById('calToday').addEventListener('click', () => {
    calRefDate = new Date();
    renderAll();
  });

  // ---- calendar cell & chip clicks ----
  document.getElementById('calGrid').addEventListener('click', (e) => {
    const cell = e.target.closest('.cal-day');
    const key = e.target.dataset.key || (cell && cell.dataset.key);
    if(key && ((cell && cell.classList.contains('has-tasks')) || e.target.classList.contains('chip') || e.target.classList.contains('more-link'))){
      openDayModal(key);
    }
  });

  // ---- modal close ----
  document.getElementById('modalClose').addEventListener('click', closeDayModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeDayModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeDayModal();
  });

  // refresh periodically so overdue badges / calendar stay live
  setInterval(renderAll, 60000);

  (async function init(){
    await load();
    renderAll();
  })();
})();
</script>
</body>
</html>
